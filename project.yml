name: FontDial

options:
  bundleIdPrefix: com.fontdial
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  FontDial:
    type: application
    platform: macOS
    sources:
      - path: FontDial
        excludes:
          - Resources/Info.plist
    info:
      path: FontDial/Resources/Info.plist
      properties:
        CFBundleIconFile: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fontdial.app
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: "$(ARCHS_STANDARD)"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
